<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../layout.css" />
    <link rel="stylesheet" href="carousel.css" />
    <title>Snap carousel | scroll-state() demo</title>
    <style>
      .item {
        container-type: scroll-state;

        img {
          transition: scale 0.3s;
          transition-delay: 0.2s;

          @container not scroll-state(snapped: inline) {
            scale: 0.85;
            transition-delay: 0s;
          }
        }
      }
    </style>
  </head>
  <body>
    <ul class="carousel">
      <!-- liの子要素はaタグ -->
      <li class="item">
        <span>
          <img src="./images/landscape_01.jpg" alt="" />
        </span>
      </li>
      <li class="item">
        <span>
          <img src="./images/landscape_02.jpg" alt="" />
        </span>
      </li>
      <li class="item">
        <span>
          <img src="./images/landscape_03.jpg" alt="" />
        </span>
      </li>
      <li class="item">
        <span>
          <img src="./images/landscape_04.jpg" alt="" />
        </span>
      </li>
      <li class="item">
        <span>
          <img src="./images/landscape_05.jpg" alt="" />
        </span>
      </li>
    </ul>

    <!-- サポートされていないブラウザ向けメッセージ -->
    <p class="message">
      Some carousel features are not supported in your browser.<br />
      Please use a browser that supports <code>::scroll-button()</code> and
      <code>::scroll-marker</code>.
    </p>
  </body>
</html>
