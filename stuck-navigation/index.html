<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=768" />
    <title>Expanding navigation | scroll-state() demo</title>
    <link rel="stylesheet" href="../layout.css" />
    <style>
      body {
        color: var(--color-text);
        background-color: var(--color-bg);
      }

      .mock-separator {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 160px;

        &.mock-separator--large {
          height: 100vh;
        }
      }

      .mock-main {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 640px;
        padding-bottom: 72px;
        font-size: 4rem;
        font-weight: normal;
        color: var(--color-text);
        text-align: center;
        background: var(--color-bg);
      }

      .nav-list-container {
        container-type: scroll-state;
        position: sticky;
        top: 20px;
        left: 0;
        margin-top: calc(-100px - 32px);
      }

      .nav-list {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        align-items: center;
        width: 560px;
        height: 72px;
        padding: 0 20px;
        margin: 0 auto;
        color: var(--color-surface);
        background: var(--color-text);
        border-radius: 40px;
        transition: all 0.4s cubic-bezier(0.32, 1.3, 0.54, 1);

        @container scroll-state(stuck: top) {
          .nav {
            transition-delay: 0.3s;
          }
        }

        @container not scroll-state(stuck: top) {
          grid-template-columns: 0 0 0 1fr;
          width: 160px;

          .nav {
            opacity: 0;
          }
        }
      }

      .nav,
      .contact {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        overflow-x: clip;
        white-space: nowrap;
        transition: all 0.2s;
      }
    </style>
  </head>
  <body>
    <div class="mock-main">scroll-state()<br />Sample</div>

    <nav class="nav-list-container">
      <ul class="nav-list">
        <li>
          <a href="" class="nav">About</a>
        </li>
        <li>
          <a href="" class="nav">Work</a>
        </li>
        <li>
          <a href="" class="nav">Careers</a>
        </li>
        <li>
          <a href="" class="contact">Contact</a>
        </li>
      </ul>
    </nav>

    <div class="mock-separator mock-separator--large"></div>
    <div class="mock-separator"></div>
  </body>
</html>
