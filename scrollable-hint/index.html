<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Back-to-top hint | scroll-state() demo</title>
    <link rel="stylesheet" href="../layout.css" />
    <style>
      body {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        padding: 16px;
        color: var(--color-text);
        background-color: var(--color-bg);
      }

      .list-container {
        position: relative;
        width: 100%;
        max-width: 400px;
        height: 100%;
        max-height: 720px;
        overflow: auto;
        background-color: var(--color-surface);
        border-radius: 8px;
        box-shadow: 0 0 0 1px var(--color-line);
        container-type: scroll-state;
      }

      .scroll-hint-wrapper {
        --duration-hint: 0.2s;

        position: sticky;
        top: 0;
        left: 0;
        display: block;
        visibility: hidden;
        width: 100%;
        height: 37px;
        padding: 4px;

        /* 上端の外から滑り込み、退場時も移動が終わるまで表示を保つ。 */
        translate: 0 -100%;
        transition:
          translate var(--duration-hint) ease,
          visibility var(--duration-hint);

        @container scroll-state(scrollable: top) {
          visibility: visible;
          translate: 0 0;
        }
      }

      .scroll-hint {
        display: block;
        height: 29px;
        padding: 4px;
        font-size: 0.875rem;
        color: var(--color-surface);
        text-align: center;
        background-color: var(--color-text-translucent);
        border-radius: 4px;
      }

      .list {
        display: flex;
        flex-direction: column;
        padding: 16px;
        margin: -37px 0 0;
      }

      .list-item {
        border-bottom: solid 1px var(--color-line);

        &:last-child {
          border-bottom: none;
        }
      }

      .list-item__link {
        display: block;
        padding: 16px 16px 16px 0;
        font-size: 1.25rem;
      }
    </style>
  </head>
  <body>
    <div class="list-container">
      <button type="button" class="scroll-hint-wrapper">
        <span class="scroll-hint">Back to top</span>
      </button>
      <ul class="list">
        <li class="list-item">
          <a href="" class="list-item__link">Item 01</a>
        </li>
        <li class="list-item">
          <a href="" class="list-item__link">Item 02</a>
        </li>
        <li class="list-item">
          <a href="" class="list-item__link">Item 03</a>
        </li>
        <li class="list-item">
          <a href="" class="list-item__link">Item 04</a>
        </li>
        <li class="list-item">
          <a href="" class="list-item__link">Item 05</a>
        </li>
        <li class="list-item">
          <a href="" class="list-item__link">Item 06</a>
        </li>
        <li class="list-item">
          <a href="" class="list-item__link">Item 07</a>
        </li>
        <li class="list-item">
          <a href="" class="list-item__link">Item 08</a>
        </li>
        <li class="list-item">
          <a href="" class="list-item__link">Item 09</a>
        </li>
        <li class="list-item">
          <a href="" class="list-item__link">Item 10</a>
        </li>
        <li class="list-item">
          <a href="" class="list-item__link">Item 11</a>
        </li>
        <li class="list-item">
          <a href="" class="list-item__link">Item 12</a>
        </li>
        <li class="list-item">
          <a href="" class="list-item__link">Item 13</a>
        </li>
        <li class="list-item">
          <a href="" class="list-item__link">Item 14</a>
        </li>
        <li class="list-item">
          <a href="" class="list-item__link">Item 15</a>
        </li>
        <li class="list-item">
          <a href="" class="list-item__link">Item 16</a>
        </li>
        <li class="list-item">
          <a href="" class="list-item__link">Item 17</a>
        </li>
        <li class="list-item">
          <a href="" class="list-item__link">Item 18</a>
        </li>
        <li class="list-item">
          <a href="" class="list-item__link">Item 19</a>
        </li>
        <li class="list-item">
          <a href="" class="list-item__link">Item 20</a>
        </li>
      </ul>
    </div>

    <script>
      const list = document.querySelector(".list");
      const hint = document.querySelector(".scroll-hint-wrapper");
      // スクロールヒントのクリックで最上部へスクロール
      hint.addEventListener("click", () => {
        list.scrollIntoView({ behavior: "instant", block: "start" });
      });
    </script>
  </body>
</html>
