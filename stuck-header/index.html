<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=768" />
    <title>Sticky header | scroll-state() demo</title>
    <link rel="stylesheet" href="../layout.css" />
    <style>
      body {
        color: var(--color-text);
        background-color: var(--color-bg);
      }

      .mock-main {
        width: 100%;
        height: 100vh;
        padding-top: 20px;
        margin-top: -95px;
        background-color: var(--color-text);
      }

      .mock-section {
        display: grid;
        place-content: center;
        place-self: center;
        height: 100vh;
        font-size: 1.5rem;
      }

      .header-container {
        position: sticky;
        top: 20px;
        left: 0;
        width: 100%;
        container-type: scroll-state;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: calc(100% - 54px * 2);
        height: 75px;
        padding: 0 20px;
        margin: 20px auto 0;
        color: var(--color-surface);
        border-radius: 8px;
        outline: 1px solid transparent;

        /* 文字と背景が途中で同色にならないよう、配色は即時切り替える。 */
        transition: outline-color 0.2s;

        @container scroll-state(stuck: top) {
          color: var(--color-text);
          background-color: var(--color-surface);
          outline-color: var(--color-text);
        }

        .header-logo {
          font-size: 1rem;
        }

        .header-button {
          padding: 8px 16px;
          color: var(--color-text);
          background-color: var(--color-surface);

          @container scroll-state(stuck: top) {
            color: var(--color-surface);
            background-color: var(--color-text);
          }
        }
      }

      .header-nav {
        display: flex;
        gap: 24px;
        align-items: center;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div class="scroll-container">
      <div class="header-container">
        <div class="header">
          <a href="" class="header-logo">LOGO</a>
          <nav>
            <ul class="header-nav">
              <li>
                <a href="">About</a>
              </li>
              <li>
                <a href="">Services</a>
              </li>
              <li>
                <a href="">News</a>
              </li>
              <li>
                <a href="" class="header-button">Contact</a>
              </li>
            </ul>
          </nav>
        </div>
      </div>

      <div class="mock-main"></div>
      <div class="mock-section">Section 01</div>
    </div>
  </body>
</html>
